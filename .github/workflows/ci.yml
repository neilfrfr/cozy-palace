name: Prototype verification
on:
  pull_request:
  push:
    branches: [main, "feat/**", "refactor/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cozy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run test:security
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:concurrency
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cozy_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:security
      - run: npm run lint
      - run: npm run lint --workspace=@cozy-palace/frontend
